<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schach — Grandmaster Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body data-board="wood">
    <div class="app">
        <header class="hud">
            <div class="hud-left">
                <a href="../index.html" class="hud-btn">← Hub</a>
                <div class="brand">♟️ SCHACH</div>
                <div id="status-pill" class="status-pill">Weiß ist am Zug</div>
            </div>
            <div class="hud-right">
                <select id="difficulty-select" class="hud-select" title="KI-Stärke">
                    <option value="1">KI: Leicht</option>
                    <option value="2" selected>KI: Mittel</option>
                    <option value="3">KI: Meister</option>
                </select>
                <button id="btn-lessons" class="hud-btn" title="Interaktive Schach-Lektionen">🎓 Lektionen</button>
                <button id="btn-hint" class="hud-btn" title="Besten Zug anzeigen">💡 Tipp</button>
                <button id="btn-analysis" class="hud-btn" title="Partie-Analyse & Tipps">📊 Analyse</button>
                <button id="btn-theme" class="hud-btn" title="Brett-Stil wechseln">🎨 Brett</button>
                <button id="btn-undo" class="hud-btn" title="Letzten Zug zurücknehmen">↩ Zurück</button>
                <button id="btn-new" class="hud-btn">Neues Spiel</button>
            </div>
        </header>

        <main class="layout">
            <section class="board-stage">
                <div id="chess-board" class="chess-board"></div>
            </section>

            <aside class="sidebar">
                <div class="panel">
                    <h3>Geschlagene Figuren</h3>
                    <div class="captured-row"><span>Schwarz:</span><div id="cap-black" class="cap-pieces"></div></div>
                    <div class="captured-row"><span>Weiß:</span><div id="cap-white" class="cap-pieces"></div></div>
                </div>
                <div class="panel log-panel">
                    <h3>Zug-Protokoll &amp; Bewertung</h3>
                    <div id="move-history" class="move-history"></div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Interactive Chess Lessons Modal -->
    <div class="modal-backdrop hidden" id="modal-lessons">
        <div class="modal-card">
            <h2>🎓 Schach-Akademie</h2>
            <p style="color:#9eb3a8;font-size:0.86rem;margin:6px 0 14px;">Wähle eine Lektion — die Stellung wird direkt auf dem Brett aufgebaut!</p>
            <div id="lessons-list" style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px;"></div>
            <button id="btn-lessons-close" class="cta-btn" style="background:#334155;">Schließen</button>
        </div>
    </div>

    <!-- Chess Game Review & Tips Modal -->
    <div class="modal-backdrop hidden" id="modal-review">
        <div class="modal-card">
            <h2>📊 Partie-Analyse &amp; Tipps</h2>
            <div class="accuracy-box">
                <small>DEINE GENAUIGKEIT</small>
                <strong id="rev-accuracy">—%</strong>
            </div>
            <div class="review-stats" id="rev-stats"></div>
            <div class="review-tips" id="rev-tips"></div>
            <button id="btn-rev-close" class="cta-btn">Schließen</button>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
